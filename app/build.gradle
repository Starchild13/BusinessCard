plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    // DEMO ERROR: This line intentionally causes a Plugin failure.
    // EXPLANATION: Attempting to apply a plugin ID 'com.nonexistent.plugin' that is not found in the classpath or plugin portals.
    id 'com.nonexistent.plugin' version '1.0.0'

    // DEMO SOLUTION:
    // Replace the incorrect configuration above with:
    // // (Remove the line entirely or use a valid plugin ID)
    // EXPLANATION: Removing invalid plugin declarations allows Gradle to configure the project.
    // Do not apply this solution yet. It is intentionally commented out for the demo.
}

android {
    namespace 'com.starchild13.businesscard'
    compileSdk 36

    defaultConfig {
        applicationId "com.starchild13.businesscard"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    // Compose UI Testing
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.11.4"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.11.4"

    // Intent testing
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.7.0"

    // Screenshot testing (optional)
    testImplementation "app.cash.paparazzi:paparazzi:1.3.5"

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.compose.ui:ui:1.11.4"
    implementation "androidx.compose.ui:ui-tooling-preview:1.11.4"
    implementation 'androidx.compose.material:material:1.11.4'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.test.espresso:espresso-web:3.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.11.4"
    debugImplementation "androidx.compose.ui:ui-tooling:1.11.4"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.11.4"
    // If you’re using the Compose BOM:
    implementation platform("androidx.compose:compose-bom:2026.06.01")

// …then pull in material-icons-extended:
    implementation "androidx.compose.material:material-icons-extended"
}